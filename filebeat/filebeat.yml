# Filebeat ships Suricata's eve.json into Elasticsearch and, via its
# Suricata module, auto-loads pre-built alert dashboards into Kibana.
# Docs: https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-module-suricata.html

filebeat.modules:
  - module: suricata
    eve:
      enabled: true
      var.paths: ["/var/log/suricata/eve.json"]

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "http://kibana:5601"

setup.dashboards.enabled: true

logging.level: info
logging.to_stderr: true
